name: Build STARLIGHT PLEOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: starlight-web-${{ github.sha }}
          path: dist/
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - name: Build a signed prototype release
        env:
          STARLIGHT_SIGNING_DIR: ${{ runner.temp }}/starlight-signing
        run: python3 android/scripts/build_release.py --skip-web-build --output ci-output/ci-verification-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: starlight-android-ci-${{ github.sha }}
          path: ci-output/
          retention-days: 14
