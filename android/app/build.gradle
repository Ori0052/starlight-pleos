apply plugin: 'com.android.application'

def signingFile = System.getenv('STARLIGHT_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('STARLIGHT_KEYSTORE_PASSWORD')
def signingAlias = System.getenv('STARLIGHT_KEY_ALIAS')
def releaseKeyPassword = System.getenv('STARLIGHT_KEY_PASSWORD')
def signedRelease = signingFile && releaseStorePassword && signingAlias && releaseKeyPassword

android {
    namespace 'com.starlight.pleos'
    compileSdk 36

    defaultConfig {
        applicationId 'com.starlight.pleos'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0-contest'
    }
    if (signedRelease) {
        signingConfigs {
            prototypeRelease {
                storeFile file(signingFile)
                storePassword releaseStorePassword
                keyAlias signingAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (signedRelease) {
                signingConfig signingConfigs.prototypeRelease
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/webAssets'))
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from(rootProject.file('../dist'))
    into(layout.buildDirectory.dir('generated/webAssets'))
    exclude('downloads/**', 'icons/README.txt')
    doFirst {
        if (!rootProject.file('../dist/index.html').exists()) {
            throw new GradleException('Build the web app first: npm ci && npm run build')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(syncWebAssets) }

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'
}

